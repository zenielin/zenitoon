<style>
:root{
  --paper:#fbf6ea; --paper2:#fffdf7; --ink:#161616; --sub:#4a4a4a;
  --red:#e2403a; --blue:#2f6fd6; --yellow:#ffd23f; --green:#2e9e6a; --soft:#f1e7cf;
  --shadow:#161616;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1d1b17; --paper2:#262420; --ink:#f2ede1; --sub:#c9c2b2;
    --soft:#34302a; --shadow:#000;
  }
}
:root[data-theme="dark"]{
  --paper:#1d1b17; --paper2:#262420; --ink:#f2ede1; --sub:#c9c2b2;
  --soft:#34302a; --shadow:#000;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Gowun Dodum',sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
h1,h2,h3{font-family:'Black Han Sans',sans-serif;font-weight:400;margin:0;letter-spacing:.5px;line-height:1.25}
.ep{background:var(--paper2);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--shadow);margin:0 6px 30px 0;padding:20px 18px 22px;border-radius:6px}
.eptag{display:inline-block;background:var(--ink);color:var(--paper2);font-family:'Black Han Sans';padding:3px 12px;border-radius:3px;font-size:14px;letter-spacing:1px}
.ep h2{font-size:26px;margin:8px 0 2px}
.ep .subt{color:var(--sub);margin:0 0 14px;font-size:14px}
/* cover */
.cover{background:var(--yellow);color:#161616;text-align:center;position:relative;overflow:hidden}
.cover .burst{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.35) 0 8deg,transparent 8deg 16deg);z-index:0}
.cover>*{position:relative;z-index:1}
.cover h1{font-size:38px;margin:10px 0 6px;text-shadow:3px 3px 0 #fff}
.cover .kick{font-family:'Jua';font-size:17px}
.cover .by{font-size:13px;margin-top:10px}
.cover .cast{display:flex;justify-content:center;gap:6px;margin:14px 0 6px;flex-wrap:wrap}
.cover .cast svg{width:78px;height:78px;background:#fff;border:3px solid #161616;border-radius:50%}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.num{background:#fff;border:2.5px solid #161616;border-radius:6px;padding:8px 4px}
.num b{display:block;font-family:'Black Han Sans';font-size:26px;color:var(--red);line-height:1.1}
.num span{font-size:12px}
/* panels */
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{border:2.5px solid var(--ink);background:var(--paper);border-radius:4px;padding:10px;position:relative;min-width:0}
.panel.wide{grid-column:1/-1}
.panel .cap{font-family:'Black Han Sans';font-size:13px;background:var(--yellow);color:#161616;display:inline-block;padding:1px 8px;border:2px solid var(--ink);margin-bottom:6px}
.panel .fx{position:absolute;right:8px;top:4px;font-family:'Black Han Sans';color:var(--red);font-size:20px;transform:rotate(8deg)}
/* scene */
.scene{display:flex;align-items:flex-start;gap:8px;margin:8px 0}
.scene.rev{flex-direction:row-reverse}
.who{flex:0 0 64px;text-align:center;font-size:11px;color:var(--sub)}
.who svg{width:62px;height:62px;border:2.5px solid var(--ink);border-radius:50%;background:#fff;display:block;margin:0 auto 2px}
.bub{position:relative;background:#fff;color:#161616;border:2.5px solid var(--ink);border-radius:16px;padding:8px 12px;font-family:'Jua';font-size:15px;line-height:1.45;flex:1;min-width:0}
.bub:before{content:"";position:absolute;left:-11px;top:16px;border:9px solid transparent;border-right-color:var(--ink);border-left:0}
.bub:after{content:"";position:absolute;left:-7px;top:18px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.rev .bub:before{left:auto;right:-11px;border-right-color:transparent;border-left:9px solid var(--ink);border-right:0}
.rev .bub:after{left:auto;right:-7px;border-right-color:transparent;border-left:7px solid #fff;border-right:0}
.bub.shout{border-radius:4px;background:var(--yellow);font-size:16px}
.bub.shout:after{border-right-color:var(--yellow)}
.rev .bub.shout:after{border-left-color:var(--yellow)}
.bub small{display:block;color:#666;font-family:'Gowun Dodum';font-size:11px;margin-top:2px}
/* boxes */
.box{border:2.5px dashed var(--ink);border-radius:6px;padding:10px 14px;margin:12px 0;background:var(--paper)}
.box h3{font-size:17px;margin-bottom:6px}
.box ul,.box ol{margin:0;padding-left:20px}
.box li{margin:3px 0}
.box.red{border-style:solid;border-color:var(--red)}
.box.blue{border-style:solid;border-color:var(--blue)}
.law{background:var(--soft);border-left:6px solid var(--blue);padding:10px 14px;font-size:14px;margin:12px 0;border-radius:0 6px 6px 0}
.law b{color:var(--blue)}
mark{background:var(--yellow);color:#161616;padding:0 3px}
/* bars */
.bars{margin:6px 0 4px}
.bar{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.bar .tr{height:20px;border:2px solid var(--ink);border-radius:3px;background:var(--paper)}
.bar .fl{height:100%;background:var(--blue)}
.bar .fl.r{background:var(--red)}.bar .fl.y{background:var(--yellow)}.bar .fl.g{background:var(--green)}
.bar b{font-family:'Black Han Sans';font-weight:400;text-align:right}
/* timeline */
.tl{list-style:none;margin:6px 0;padding:0 0 0 22px;border-left:4px solid var(--ink)}
.tl li{position:relative;margin:0 0 12px;padding-left:6px}
.tl li:before{content:"";position:absolute;left:-33px;top:4px;width:16px;height:16px;background:var(--yellow);border:3px solid var(--ink);border-radius:50%}
.tl li.now:before{background:var(--red)}
.tl .d{font-family:'Black Han Sans';font-size:14px;color:var(--red)}
/* flow */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:stretch;margin:8px 0}
.flow div{border:2.5px solid var(--ink);border-radius:5px;padding:8px 4px;text-align:center;font-size:13px;background:var(--paper);font-family:'Jua';display:flex;align-items:center;justify-content:center;min-width:0}
.flow div.k{background:var(--yellow);color:#161616}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:2px solid var(--ink);border-radius:20px;padding:2px 10px;font-size:13px;background:var(--paper)}
.chip.hl{background:var(--red);color:#fff;border-color:var(--red)}
/* number cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{border:2.5px solid var(--ink);border-radius:6px;padding:10px;text-align:center;background:var(--paper)}
.card b{font-family:'Black Han Sans';font-size:30px;font-weight:400;display:block;color:var(--blue);line-height:1.1}
.card span{font-size:13px}
/* checklist */
.chk{list-style:none;padding:0;margin:6px 0}
.chk li{border:2px solid var(--ink);border-radius:5px;padding:8px 10px 8px 40px;margin:7px 0;position:relative;background:var(--paper);font-size:14px}
.chk li:before{content:"";position:absolute;left:10px;top:9px;width:18px;height:18px;border:2.5px solid var(--ink);border-radius:3px;background:#fff}
.chk li b{color:var(--red)}
.tagline{font-size:12px;color:var(--sub)}
.quote{text-align:center;font-family:'Jua';font-size:19px;margin:14px 0 4px}
.src{font-size:12px;color:var(--sub);border-top:2px dashed var(--ink);margin-top:14px;padding-top:8px}
.theme-btn{position:fixed;right:12px;bottom:12px;z-index:9;border:2.5px solid var(--ink);background:var(--paper2);color:var(--ink);font-family:'Jua';border-radius:20px;padding:4px 12px;cursor:pointer}
@media (max-width:540px){
  .g4{grid-template-columns:1fr}
  .cover h1{font-size:30px}
  .ep h2{font-size:22px}
  .nums,.cards{grid-template-columns:repeat(2,1fr)}
  .flow{grid-template-columns:1fr}
  .flow div{padding:6px}
  .bar{grid-template-columns:86px 1fr 46px;font-size:13px}
  .cover .cast svg{width:60px;height:60px}
}
@media print{.theme-btn{display:none}}
</style>

.zt-nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--paper2);border-bottom:3px solid var(--ink);padding:8px 14px;font-family:'Jua',sans-serif;font-size:14px}
.zt-nav a{color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:16px;padding:1px 10px;background:var(--paper)}

.zt-cta b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:19px}

.zt-links a{color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:5px;padding:4px 12px;font-family:'Jua',sans-serif;background:var(--paper2)}
@media print{.zt-nav,.zt-end{display:none}}
</style>

<script>
/* ---------- 오리지널 캐릭터 SVG ---------- */
const CH={
  rookie:{name:'새내기 감독관',skin:'#f7d2b0',hair:'#2a2a2a',style:'short',acc:'badge',shirt:'#2f6fd6'},
  vet:{name:'숙련 감독관',skin:'#efc8a4',hair:'#9a9a9a',style:'side',acc:'glasses',shirt:'#4b5563'},
  local:{name:'지방정부 담당관',skin:'#f3cfab',hair:'#6b3f1f',style:'bob',acc:'lanyard',shirt:'#2e9e6a'},
  boss:{name:'소규모 사업장 사장님',skin:'#e9bf98',hair:'#3b3b3b',style:'bald',acc:'apron',shirt:'#e2403a'},
  hr:{name:'인사담당자',skin:'#f6d3b3',hair:'#40261a',style:'long',acc:'none',shirt:'#8b5cf6'},
  chief:{name:'노동정책실장',skin:'#f1cba7',hair:'#222',style:'neat',acc:'tie',shirt:'#1f2937'},
  bot:{name:'안내로봇 체키',bot:true}
};
function face(k,mood='calm'){
  const c=CH[k];
  if(c.bot){
    const eye= mood==='shock'?'<circle cx="30" cy="40" r="6" fill="#161616"/><circle cx="50" cy="40" r="6" fill="#161616"/>'
      :'<rect x="24" y="36" width="12" height="8" rx="3" fill="#161616"/><rect x="44" y="36" width="12" height="8" rx="3" fill="#161616"/>';
    const m= mood==='shock'?'<ellipse cx="40" cy="56" rx="5" ry="6" fill="#161616"/>':'<path d="M30 54 Q40 62 50 54" stroke="#161616" stroke-width="3" fill="none"/>';
    return `<svg viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="18" stroke="#161616" stroke-width="3"/><circle cx="40" cy="7" r="4" fill="#e2403a" stroke="#161616" stroke-width="2"/><rect x="14" y="18" width="52" height="48" rx="12" fill="#ffd23f" stroke="#161616" stroke-width="3"/><rect x="20" y="28" width="40" height="34" rx="8" fill="#fff" stroke="#161616" stroke-width="2"/>${eye}${m}<rect x="8" y="34" width="6" height="14" rx="2" fill="#2f6fd6" stroke="#161616" stroke-width="2"/><rect x="66" y="34" width="6" height="14" rx="2" fill="#2f6fd6" stroke="#161616" stroke-width="2"/></svg>`;
  }
  const S='#161616';
  let hair='';
  switch(c.style){
    case 'short': hair=`<path d="M18 38 Q18 14 40 14 Q62 14 62 38 Q58 24 40 24 Q26 24 18 38Z" fill="${c.hair}"/>`;break;
    case 'side': hair=`<path d="M18 38 Q16 16 40 15 Q64 16 62 36 Q52 22 30 26 Q22 28 18 38Z" fill="${c.hair}"/>`;break;
    case 'bob': hair=`<path d="M15 50 Q12 14 40 13 Q68 14 65 50 L58 50 Q60 26 40 24 Q20 26 22 50Z" fill="${c.hair}"/>`;break;
    case 'bald': hair=`<path d="M19 36 Q20 30 24 30 L24 40 Z M61 36 Q60 30 56 30 L56 40Z" fill="${c.hair}"/>`;break;
    case 'long': hair=`<path d="M14 66 Q10 14 40 13 Q70 14 66 66 L58 66 Q62 28 40 24 Q18 28 22 66Z" fill="${c.hair}"/>`;break;
    case 'neat': hair=`<path d="M18 36 Q18 14 40 14 Q62 14 62 36 Q60 22 46 21 L44 26 Q30 22 18 36Z" fill="${c.hair}"/>`;break;
  }
  let brows='',eyes='',mouth='',extra='';
  const ey=40;
  if(mood==='angry'){brows=`<path d="M26 31 L36 35 M54 31 L44 35" stroke="${S}" stroke-width="3"/>`;}
  else if(mood==='sad'){brows=`<path d="M26 34 L35 31 M54 34 L45 31" stroke="${S}" stroke-width="2.5"/>`;}
  else if(mood==='shock'){brows=`<path d="M26 29 Q31 26 36 29 M44 29 Q49 26 54 29" stroke="${S}" stroke-width="2.5" fill="none"/>`;}
  else {brows=`<path d="M27 32 Q31 30 35 32 M45 32 Q49 30 53 32" stroke="${S}" stroke-width="2.5" fill="none"/>`;}
  if(mood==='shock'){eyes=`<circle cx="31" cy="${ey}" r="4.5" fill="#fff" stroke="${S}" stroke-width="2"/><circle cx="31" cy="${ey}" r="2" fill="${S}"/><circle cx="49" cy="${ey}" r="4.5" fill="#fff" stroke="${S}" stroke-width="2"/><circle cx="49" cy="${ey}" r="2" fill="${S}"/>`;mouth=`<ellipse cx="40" cy="56" rx="5" ry="6" fill="${S}"/>`;}
  else if(mood==='happy'){eyes=`<path d="M27 41 Q31 36 35 41 M45 41 Q49 36 53 41" stroke="${S}" stroke-width="3" fill="none"/>`;mouth=`<path d="M30 52 Q40 63 50 52 Z" fill="${S}"/>`;}
  else {eyes=`<circle cx="31" cy="${ey}" r="3" fill="${S}"/><circle cx="49" cy="${ey}" r="3" fill="${S}"/>`;
    mouth= mood==='sad'?`<path d="M32 57 Q40 51 48 57" stroke="${S}" stroke-width="3" fill="none"/>`: mood==='angry'?`<path d="M32 56 L48 56" stroke="${S}" stroke-width="3"/>`:`<path d="M32 53 Q40 60 48 53" stroke="${S}" stroke-width="3" fill="none"/>`;}
  if(c.acc==='glasses') extra+=`<circle cx="31" cy="${ey}" r="7" fill="none" stroke="${S}" stroke-width="2.2"/><circle cx="49" cy="${ey}" r="7" fill="none" stroke="${S}" stroke-width="2.2"/><path d="M38 ${ey} L42 ${ey}" stroke="${S}" stroke-width="2"/><path d="M33 49 Q40 46 47 49" stroke="#9a9a9a" stroke-width="3" fill="none"/>`;
  let body=`<path d="M10 80 Q12 64 40 64 Q68 64 70 80Z" fill="${c.shirt}" stroke="${S}" stroke-width="2.5"/>`;
  if(c.acc==='badge') body+=`<path d="M52 69 l5 0 l2 4 l-4.5 3 l-4.5 -3Z" fill="#ffd23f" stroke="${S}" stroke-width="1.5"/>`;
  if(c.acc==='lanyard') body+=`<path d="M30 64 L40 76 L50 64" stroke="#ffd23f" stroke-width="3" fill="none"/><rect x="36" y="74" width="8" height="6" fill="#fff" stroke="${S}" stroke-width="1.5"/>`;
  if(c.acc==='apron') body+=`<rect x="28" y="68" width="24" height="12" fill="#fff" stroke="${S}" stroke-width="2"/>`;
  if(c.acc==='tie') body+=`<path d="M37 64 L43 64 L41.5 69 L44 78 L40 80 L36 78 L38.5 69Z" fill="#e2403a" stroke="${S}" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 80 80">${body}<ellipse cx="40" cy="42" rx="22" ry="24" fill="${c.skin}" stroke="${S}" stroke-width="2.5"/>${hair}<circle cx="24" cy="50" r="3.5" fill="#f59e9e" opacity=".6"/><circle cx="56" cy="50" r="3.5" fill="#f59e9e" opacity=".6"/>${brows}${eyes}${mouth}${extra}</svg>`;
}
/* ---------- 컴포넌트 ---------- */
function S(k,mood,name,text,o={}){
  return `<div class="scene ${o.rev?'rev':''}"><div class="who">${face(k,mood)}${name||CH[k].name}</div><div class="bub ${o.shout?'shout':''}">${text}${o.note?`<small>${o.note}</small>`:''}</div></div>`;
}
function P(cap,body,o={}){return `<div class="panel ${o.wide?'wide':''}">${cap?`<div class="cap">${cap}</div>`:''}${o.fx?`<div class="fx">${o.fx}</div>`:''}${body}</div>`;}
function WHO(list){return `<div class="chips">${list.map(([n,h])=>`<span class="chip ${h?'hl':''}">${n}</span>`).join('')}</div>`;}
function bars(rows,max){return `<div class="bars">${rows.map(([l,v,u,c])=>`<div class="bar"><span>${l}</span><div class="tr"><div class="fl ${c||''}" style="width:${Math.max(4,v/max*100)}%"></div></div><b>${v}${u}</b></div>`).join('')}</div>`;}
function EP(tag,title,sub,body,cls=''){return `<section class="ep ${cls}"><span class="eptag">${tag}</span><h2>${title}</h2>${sub?`<p class="subt">${sub}</p>`:''}${body}</section>`;}

/* ---------- 본문 ---------- */
let H='';

/* 표지 */
H+=`<section class="ep cover"><div class="burst"></div>
<div class="kick">고용노동부 보도 내용을 만화로 쉽게!</div>
<h1>새내기 감독관,<br>감독학교 가다</h1>
<div class="kick">숙련 감독관 노하우 → 36개 점검항목 표준화 · 9개 업종 모의 감독 실습</div>
<div class="cast">${face('rookie','happy')}${face('vet','calm')}${face('local','calm')}${face('bot','calm')}</div>
<div class="nums">
 <div class="num"><b>36</b><span>표준 점검항목</span></div>
 <div class="num"><b>9</b><span>실습 업종</span></div>
 <div class="num"><b>8주</b><span>이론 2주+실습 6주</span></div>
 <div class="num"><b>27명</b><span>8개 지방정부 참여</span></div>
 <div class="num"><b>5곳</b><span>시행 초기 감독 착수</span></div>
 <div class="num"><b>12.8</b><span>지방감독 시행</span></div>
</div>
<div class="by">작성 · ㈜제니엘이노베이션 &nbsp;|&nbsp; 2026.10.26</div>
</section>`;

/* EP.0 */
H+=EP('EP.0','한눈에 보는 감독학교','무엇이, 언제, 얼마나 바뀌나',
`${S('bot','calm','','안녕하세요, 안내로봇 <b>체키</b>예요! 12월 8일부터 <mark>시·도에도 노동감독관</mark>이 생겨요. 그런데 이분들, <b>전원 신규</b>래요!')}
