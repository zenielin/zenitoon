<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제니툰 — 오프라인</title>
<meta name="theme-color" content="#ffd23f">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fbf6ea;color:#161616;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.box{max-width:360px;border:3px solid #161616;border-radius:8px;background:#fffdf7;box-shadow:6px 6px 0 #161616;padding:24px}
img{width:96px;height:96px;border:3px solid #161616;border-radius:50%}
h1{font-size:22px;margin:12px 0 6px}
p{font-size:15px;line-height:1.6;margin:0 0 14px;color:#444}
button{border:2.5px solid #161616;background:#ffd23f;border-radius:6px;padding:8px 18px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <img src="/icon-192.png" alt="">
  <h1>인터넷 연결이 끊겼어요</h1>
  <p>이전에 열어 본 웹툰은 연결 없이도 볼 수 있어요.<br>연결되면 새 회차를 불러옵니다.</p>
  <button onclick="location.href='/'">다시 시도</button>
</div>
</body>
</html>
